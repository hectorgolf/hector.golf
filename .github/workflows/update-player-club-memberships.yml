# Workflow for attempting to identify club memberships for players who don't have one on record
# and thus potentially triggering a new build of the Astro site.
#
name: Update club memberships

on:
  # No `schedule:` here, deliberately. Cloud Scheduler is the only clock.
  #
  # GitHub queues `schedule` events and delivers them when it has capacity, which
  # for this repository has meant hours: on 2026-09-16 the last scheduled
  # delivery of each workflow here was between two and five hours late, and one
  # of them landed on the wrong calendar day. A cron kept "as a backstop" is
  # therefore a second clock that is always wrong, and its runs are duplicates
  # somebody has to explain every time they read the Actions tab.
  #
  # What starts this now is `terraform/scheduler.tf` -> the admin service ->
  # `workflow_dispatch`, which GitHub delivers immediately. Which workflows the
  # tick starts, and how often, is `DISPATCHABLE_WORKFLOWS` in
  # `admin/src/lib/workflows.ts`; `admin/src/lib/cadence.ts` explains the
  # intervals and why they are intervals rather than crons.
  #
  # The cost, chosen knowingly: if Cloud Scheduler or the admin service is down,
  # this does not run, and nothing goes red to say so. Before, it would merely
  # have been late.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  id-token: write

# Shared with the other three data updates on purpose: they all end in the same
# `git pull -r && git push` in commit-changes.sh, and GitHub delivers this
# workflow's cron hours late, so "it runs at a different time" was never an
# interlock. See update-handicaps.yml for the full note.
concurrency:
  group: "data-update"
  cancel-in-progress: false

env:
  BUILD_PATH: ./astrosite

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces keep one lockfile, at the repository root, so the
      # install happens there rather than inside astrosite/.
      - name: Install dependencies
        run: npm ci
      - name: Run script
        run: |
          npx tsx src/workflows/update-player-club-memberships.ts
        working-directory: ${{ env.BUILD_PATH }}
        env:
          WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
          WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
      - name: Commit changes
        id: commit
        run: |
          scripts/commit-changes.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GIT_AUTHOR_NAME: update-memberships.yml
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: update-memberships.yml
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}

      # A push made with GITHUB_TOKEN does not trigger workflows, so deploy-site.yml's
      # `on: push` has never fired for these commits and the site waited for that
      # workflow's own cron. This asks the admin service — which holds a token
      # that is not GITHUB_TOKEN — to dispatch it now instead.
      - name: Request a deploy
        uses: ./.github/actions/request-deploy
        with:
          committed: ${{ steps.commit.outputs.committed }}
          wif_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          admin_domain: ${{ vars.TF_ADMIN_DOMAIN }}
          iap_client_id: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
