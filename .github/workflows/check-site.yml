# Runs the public site's test suites and its production build on pull requests.
#
# Separate from check-admin.yml and check-backend.yml: they are different packages
# with different failure modes, and one workflow each keeps any of them from going
# red for another's reasons. This one and check-admin.yml install from the one
# workspace lockfile at the repository root.
#
# This used to run on every pull request, with no paths filter at all, which made
# it the de facto "something changed" check — a terraform- or docs-only PR built
# the whole site to prove nothing. The filter below is the set of things the build
# and the suites actually read: the site itself, the two workspace packages it
# imports, the root manifest and lockfile `npm ci` installs from, and the Node
# version setup-node pins to.
name: Check site

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'astrosite/**'
      - 'packages/schemas/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/check-site.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    environment: production

    env:
      # Wisegolf credentials
      WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
      WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
      # API key for app.hector.golf
      HECTOR_APP_API_KEY: ${{ secrets.HECTOR_APP_API_KEY }}
      # Public URL of the leaderboard proxy. Unset simply leaves the live
      # leaderboard off, and every page renders from the last published snapshot.
      PUBLIC_LEADERBOARD_PROXY_URL: ${{ vars.PUBLIC_LEADERBOARD_PROXY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # One lockfile at the workspace root installs every package.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        working-directory: astrosite

      - name: Build
        run: npm run build
        working-directory: astrosite
