# Builds the admin service and rolls it out to Cloud Run.
#
# This workflow was committed alongside the infrastructure, before the app it
# deploys existed, so that the deploy path was reviewed once, up front, rather
# than improvised on the day the app was ready. It is inert until `admin/`
# contains a Dockerfile: the guard step below skips the deploy and says so,
# rather than failing.
#
# The build context is the repository root, not admin/, because the app imports
# @hector/ui through the npm workspace. The image is built in the runner and
# pushed straight to Artifact Registry.
# Cloud Build is deliberately not in the path: `gcloud run deploy --source`
# would auto-create its own `cloud-run-source-deploy` repository, which
# Terraform does not manage and whose images therefore escape the cleanup
# policies in terraform/artifact_registry.tf.
name: Deploy admin.hector.golf

# The paths filter is the image's whole input set, not just admin/. The build
# context is the repository root, so a change to anything the Dockerfile copies
# in has to reach here: the workspace packages admin imports, the root manifest
# and lockfile `npm ci` installs from, the Node version it installs under, and
# the root .dockerignore that decides what the context contains at all.
#
# `admin/**` alone was the filter until this was noticed, and it was the worst
# place in the repo to have this gap: a merge that only touched packages/ui
# passed check-admin.yml, went green, and then never deployed, leaving Cloud Run
# serving the old shared UI indefinitely. deploy-site.yml has a cron that
# eventually covers for the same mistake; this has nothing. The list mirrors
# check-admin.yml, which builds the same image on the pull request.
on:
  push:
    branches: ["main"]
    paths:
      - 'admin/**'
      - 'packages/schemas/**'
      - 'packages/ui/**'
      # The WiseGolf client the handicaps job scrapes with. Easy to leave out:
      # this list has to name every workspace package the image contains, and a
      # missing one does not fail anything — it just means a change to that
      # package never reaches the running service, which looks like the fix not
      # working.
      - 'packages/wisegolf/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.dockerignore'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: "deploy-admin"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A different, weaker identity than Terraform's: it can push images and
      # roll out revisions, and cannot touch the infrastructure around them.
      # This workflow's own path is in the trigger above, so it fires whenever it
      # is edited — including the commit that first added it, when there was no
      # admin/ yet. "Nothing to deploy" is not a failure, so skip and say so.
      - name: Check there is an app to deploy
        id: guard
        run: |
          if [ -f admin/Dockerfile ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No admin/Dockerfile yet, so there is nothing to deploy. This workflow starts working once the admin service lands under admin/."
          fi

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.deployable == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud
        if: steps.guard.outputs.deployable == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.guard.outputs.deployable == 'true'
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Two tags, for two different readers.
      #
      # The SHA tag is what actually gets deployed, so every running revision is
      # traceable to a commit. `latest` is never deployed by this workflow — it
      # exists so Terraform has a real image to name when it has to supply one
      # itself, which happens if the service is ever recreated from scratch.
      #
      # Both are safe with the cleanup policies: when `latest` moves on, the
      # previous digest still carries its SHA tag, so it stays TAGGED and
      # `delete-untagged` leaves it alone. `keep-recent` still governs.
      - name: Build and push
        id: image
        if: steps.guard.outputs.deployable == 'true'
        run: |
          IMAGE="${{ vars.GH_IMAGE_REPO }}:${GITHUB_SHA::12}"
          LATEST="${{ vars.GH_IMAGE_REPO }}:latest"
          docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" \
            --file admin/Dockerfile \
            --tag "$IMAGE" --tag "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        if: steps.guard.outputs.deployable == 'true'
        run: |
          gcloud run deploy hector-admin \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ steps.image.outputs.image }}" \
            --quiet

      - name: Summarise
        if: steps.guard.outputs.deployable == 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Service: hector-admin in ${{ vars.GCP_REGION }}"
          } >> "$GITHUB_STEP_SUMMARY"
