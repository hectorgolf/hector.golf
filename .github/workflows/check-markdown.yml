# Lints the Markdown on pull requests.
#
# Separate from the other three check workflows for the reason they are separate
# from each other: different inputs, different failure modes, and one workflow
# each keeps any of them from going red for another's reasons. This one is also
# the only check that spans the whole repository rather than one package —
# `docs/`, the six READMEs, and anything else that grows a `.md`.
#
# ## What it runs on
#
# The inputs to a Markdown lint are the Markdown and the lint configuration, so
# the path filter names both. `.markdownlint-cli2.jsonc` is the obvious half;
# `package-lock.json` is the other, because it pins the linter version and a bump
# can change what passes. That does mean an unrelated dependency bump runs this,
# which is the cheaper mistake: the alternative is a linter upgrade landing on
# main and breaking the next docs PR instead of its own.
#
# ## Why the install looks like that
#
# `markdownlint-cli2` is a devDependency of the *root* package, and nothing in
# `astrosite`, `admin` or `packages/*` is involved in linting prose. A plain
# `npm ci` at the root would install all of them — Astro, the admin app and their
# trees — to run one linter over some text files. `--workspaces=false
# --include-workspace-root` installs the root package alone, from the same
# lockfile, so the version is still the pinned one.
name: Check markdown

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'package-lock.json'
      - '.github/workflows/check-markdown.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The root package only — see the header. markdownlint-cli2 is the whole of
      # its dependency tree.
      - name: Install markdownlint
        run: npm ci --workspaces=false --include-workspace-root

      # Lints every .md in the repository, not only the ones this PR touched. The
      # globs and ignores are in .markdownlint-cli2.jsonc, so what CI checks and
      # what `npm run lint:md` checks on a laptop cannot drift apart.
      - name: Lint
        run: npm run lint:md
