# Workflow for running weekly player biography updates and thus potentially
# triggering a new build of the Astro site.
#
name: Update players' biographies

on:
  # Runs at 02:30 UTC on the 10th and 25th of every month
  schedule:
    - cron: "30 2 10,25 * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  id-token: write

# Shared with the other three data updates on purpose: they all end in the same
# `git pull -r && git push` in commit-changes.sh, and GitHub delivers this
# workflow's cron hours late, so "it runs at a different time" was never an
# interlock. See update-handicaps.yml for the full note.
concurrency:
  group: "data-update"
  cancel-in-progress: false

env:
  BUILD_PATH: ./astrosite

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces keep one lockfile, at the repository root, so the
      # install happens there rather than inside astrosite/.
      - name: Install dependencies
        run: npm ci
      # Firestore is the system of record now, so the scrape writes documents
      # rather than files — see docs/plans/everything-to-firestore.md. It needs an
      # identity with `roles/datastore.user`, which is what GH_DEPLOYER_SA already
      # holds for the seed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}
      - name: Run script
        run: |
          npx tsx src/workflows/update-player-biographies.ts
        working-directory: ${{ env.BUILD_PATH }}
        env:
          # The Firestore client in src/workflows/store.ts reads this.
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
          WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
          ASTROSITE_API_KEY: ${{ secrets.ASTROSITE_API_KEY }}
      - name: Publish the data snapshot
        uses: ./.github/actions/publish-snapshot
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          committer_email: ${{ secrets.GIT_COMMITTER_EMAIL }}
          committer_name: update-player-biographies.yml
          wif_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          admin_domain: ${{ vars.TF_ADMIN_DOMAIN }}
          iap_client_id: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
