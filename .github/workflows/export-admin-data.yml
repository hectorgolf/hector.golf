# Publish what the admin UI authored into the committed data files the site
# builds from. Deploying them is a separate press, deliberately; see below.
#
# This is the step that makes the admin usable without a laptop. Firestore is
# where a matchplay tournament or a player is edited, and
# `astrosite/src/data/events/matchplay/` and `astrosite/src/data/players/` are
# generated from it.
#
# **It does not deploy the site, and that is a decision rather than a
# limitation.** Publishing is two presses: this, then Deploy hector.golf. Both
# are on /operations.
#
# How it currently fails to deploy is mechanical: the push below is made with the
# GITHUB_TOKEN that actions/checkout leaves behind, and a push made with
# GITHUB_TOKEN does not trigger workflows. deploy-site.yml says so in its own
# header, which is why a scrape asks the admin service to dispatch a deploy
# rather than relying on its commit to do it. This workflow cannot make that
# request, because the admin is behind IAP.
#
# That much reads as a gap to close, and closing it is easy — deploy-site.yml
# would take a `workflow_run` trigger on this workflow completing, the way
# refresh-admin-mirror.yml already does, with no credential involved. **Don't.**
# Reviewed and kept on 2026-09-21, for a reason that is about the operation
# rather than the plumbing:
#
# An export is a *bulk* write. It republishes every record the admin owns — 48 of
# them today — from whatever Firestore happens to hold. The second press is the
# only point at which a person looks at what is about to become the public site,
# and it is the only thing standing between a wrong store and hector.golf.
#
# That is not hypothetical. On the morning players were flipped to being authored
# here, production Firestore was two hand-corrections stale: 6ca4e486 had fixed
# two players' club from KJKG to Koto in the committed files and the mirror had
# never heard about it. An export at that moment would have written the stale
# value back, and an auto-deploying one would have published it. What made that
# recoverable was having somewhere to stop and look.
#
# If the two presses ever do grate, `workflow_run` is the cheap version and is
# preferable to giving this workflow a personal access token: this one exits 0
# whether it pushed or found nothing, so it would deploy on no-op runs too, which
# is a better price than a standing repository-wide credential nothing warns you
# about the expiry of.
#
# Manual rather than scheduled, deliberately. An export is the act of publishing
# an edit, and a schedule would publish half-finished ones — a bracket drawn but
# not yet corrected, a result typed into the wrong match. The admin is used a
# handful of times a month by two people, so "press the button when you mean it"
# is the right amount of ceremony. It is also why there is no automatic export
# after every write.
#
# What it exports is decided in admin/scripts/export.ts, not here: matchplay
# events and, since 2026-09-21, players. Courses are staged too, ahead of being
# exported at all — the block in export.ts is behind COURSES_ARE_OWNED, so today
# this stages a directory nothing writes. See docs/current/data-ownership.md for
# why publishing the rest would revert the scrape.
#
# The staging below has to keep up with that list, and it is the one place where
# it does not follow automatically — `export.ts` deciding to publish a collection
# means nothing if this step does not stage it. A path missing here is an export
# that runs, reports what it wrote, and pushes none of it.
#
# That is not a hypothetical: it is what this file did to players on 2026-09-21,
# and it was caught by reading the workflow rather than by anything failing.
# Courses are therefore staged *before* they are exported, so the two can never
# be out of step in the direction that loses work.
name: Export admin data

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# One at a time, and never cancel one in flight: a cancelled export can leave
# some files written and others not, and the difference is invisible until the
# next run.
concurrency:
  group: "export-admin-data"
  cancel-in-progress: false

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Nothing here works until the GCP variables exist. Skip rather than fail,
      # so a fork or a half-configured repository says why instead of going red.
      - name: Check the project is configured
        id: guard
        run: |
          if [ -n "${{ vars.GH_WIF_PROVIDER }}" ] && [ -n "${{ vars.GH_DEPLOYER_SA }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_WIF_PROVIDER or GH_DEPLOYER_SA is unset, so there is no project to export from. See docs/playbooks/gcp-bootstrapping.md."
          fi

      - name: Setup Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Export
        if: steps.guard.outputs.configured == 'true'
        run: npm run export
        working-directory: admin
        env:
          # The database id is left to the script's default, which is the one
          # Terraform creates. The project is a variable because it already is
          # one everywhere else.
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          # Where an uploaded image is until this job fetches it. Without this
          # the export dies on the first course that has one — which is what it
          # did, the first time anybody uploaded one.
          #
          # Derived rather than a repository variable of its own, because the
          # name is derived: `terraform/storage.tf` calls the bucket
          # "${var.project_id}-assets". A second variable would be a second
          # place to keep that agreement, set by hand, discovered wrong here.
          ASSET_BUCKET: ${{ vars.GCP_PROJECT_ID }}-assets

      - name: Commit what changed
        id: commit
        if: steps.guard.outputs.configured == 'true'
        run: |
          git config user.name "export-admin-data.yml"
          git config user.email "${{ secrets.GIT_COMMITTER_EMAIL }}"

          # -A rather than a list of modified files: a new tournament is an added
          # file and a deleted one is a removal, and both are ordinary results of
          # an export. astrosite/scripts/commit-changes.sh stages only modified
          # files, which is fine for the scrape — it never creates or deletes —
          # and would silently drop the most common thing done here.
          #
          # Both collections export.ts publishes, named rather than globbed to
          # `astrosite/src/data`: the scrape's own outputs live in that tree too,
          # and a wider pattern here would commit a half-finished scrape under an
          # export's commit message.
          # `astrosite/public/images/courses` is the second kind of output this
          # export has: an uploaded course image is downloaded from the asset
          # bucket and written there, and one no course references any more is
          # deleted. Only the `uploaded/` directory under each course is ever
          # touched — everything else under images/courses belongs to whoever
          # put it there, 18 unreferenced La Finca hole diagrams included.
          git add -A astrosite/src/data/events/matchplay astrosite/src/data/players astrosite/src/data/courses \
            astrosite/public/images/courses

          # Reported rather than just returned, because the step after this one
          # asks for a deploy and must not ask when there is nothing new to
          # deploy. Same contract `astrosite/scripts/commit-changes.sh` gives
          # the scrape workflows.
          if git diff --cached --quiet; then
            echo "Nothing to publish: the committed files already match the store."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --name-status | sed 's/^/  /'

          {
            echo "Publish admin edits to the committed data files"
            echo
            echo "Github Action:      $GITHUB_WORKFLOW"
            echo "GITHUB_RUN_NUMBER:  $GITHUB_RUN_NUMBER"
            echo
            echo "Exported from Firestore by admin/scripts/export.ts:"
            git diff --cached --name-status | sed 's/^/- /'
          } > /tmp/export-commit-message

          git commit -F /tmp/export-commit-message
          git pull -r
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Without this, "Publish admin edits" committed and stopped there: the
      # site kept serving the previous build until something else happened to
      # deploy it. A push made with GITHUB_TOKEN does not trigger workflows, so
      # deploy-site.yml's `on: push` has never fired for these commits — the
      # same hole the scrape workflows have, and this is the same patch, the
      # one already written for them. Publishing now means published.
      - name: Request a deploy
        if: steps.guard.outputs.configured == 'true'
        uses: ./.github/actions/request-deploy
        with:
          committed: ${{ steps.commit.outputs.committed }}
          wif_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          admin_domain: ${{ vars.TF_ADMIN_DOMAIN }}
          iap_client_id: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}

      - name: Summarise
        if: steps.guard.outputs.configured == 'true'
        run: |
          {
            echo "### Exported"
            echo
            echo "The public site does **not** rebuild by itself from this."
            echo
            echo "This pushed with \`GITHUB_TOKEN\`, and a push made with that token does not"
            echo "trigger workflows — so \`deploy-site.yml\` has not seen it. Press **Deploy"
            echo "hector.golf** on the admin's Operations page, or run the workflow from here."
          } >> "$GITHUB_STEP_SUMMARY"
