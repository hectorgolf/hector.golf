# Plans the infrastructure in terraform/ on every pull request that touches it,
# and posts the plan as a comment so the diff is reviewable alongside the code.
#
# Formatting and validation need nothing from GCP, so they always run. The plan
# needs credentials, and before the project has been wired up to GitHub (step 7
# of the playbook) there are none — on that pull request the honest answer is
# "there is nothing here I can plan yet", so the plan is skipped rather than
# failed. Partially configured is a different thing and still fails; see the
# guard step for why that case is the dangerous one.
#
# This job can read everything and lock the state file, but it never applies —
# that is terraform-apply.yml, gated by the `infrastructure` environment.
name: Terraform plan

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  id-token: write       # required to mint the OIDC token for Workload Identity Federation
  pull-requests: write  # required to post the plan comment

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.1

      # These two touch no cloud, so the pull request that introduces terraform/
      # still gets real checking even though it cannot be planned.
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Check GitHub is wired up to GCP
        id: guard
        env:
          WIF_PROVIDER: ${{ vars.GH_WIF_PROVIDER }}
          TERRAFORM_SA: ${{ vars.GH_TERRAFORM_SA }}
          ADMIN_PRINCIPALS: ${{ secrets.TF_ADMIN_PRINCIPALS }}
        run: |
          missing=""
          if [ -z "$WIF_PROVIDER" ]; then missing="$missing GH_WIF_PROVIDER"; fi
          if [ -z "$TERRAFORM_SA" ]; then missing="$missing GH_TERRAFORM_SA"; fi
          if [ -z "$ADMIN_PRINCIPALS" ]; then missing="$missing TF_ADMIN_PRINCIPALS"; fi

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Nothing set at all means the project has not been bootstrapped yet,
          # which is the expected state on the pull request that adds terraform/.
          if [ -z "$WIF_PROVIDER" ] && [ -z "$TERRAFORM_SA" ] && [ -z "$ADMIN_PRINCIPALS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP is not wired up to GitHub yet — step 7 of docs/gcp-setup-playbook.md. Skipping the plan; formatting and validation still ran."
            exit 0
          fi

          # Some set and some not is a misconfiguration rather than a not-yet,
          # and it is the shape that does damage: a plan missing
          # TF_ADMIN_PRINCIPALS reads admin_principals as an empty list, which is
          # an instruction to revoke every IAP binding rather than a no-op.
          echo "::error::Partially configured. Missing:$missing"
          echo "::error::Finish step 7 of docs/gcp-setup-playbook.md before CI plans anything."
          exit 1

      # Keyless: Actions presents its OIDC token and exchanges it for a
      # short-lived GCP access token. There is no service account key anywhere.
      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_TERRAFORM_SA }}

      # -reconfigure because the validate step above initialised without a
      # backend, and Terraform otherwise refuses to change backend settings.
      - name: Init
        if: steps.guard.outputs.configured == 'true'
        run: terraform init -reconfigure -input=false

      - name: Plan
        id: plan
        if: steps.guard.outputs.configured == 'true'
        # pipefail matters: GitHub runs steps as `bash -e {0}`, which does not
        # set it, so without this the exit status would be tee's and a failed
        # plan would report success.
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt
        env:
          # A JSON array, from a secret rather than a committed tfvars file:
          # this repository is public and these are people's email addresses.
          TF_VAR_admin_principals: ${{ secrets.TF_ADMIN_PRINCIPALS }}
          # Unset until the OAuth client exists (playbook step 5); the IAP
          # settings resource is simply absent from the plan until then.
          TF_VAR_iap_oauth_client_id: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
          TF_VAR_iap_oauth_client_secret: ${{ secrets.TF_IAP_OAUTH_CLIENT_SECRET }}

      - name: Comment the plan on the pull request
        if: always() && steps.guard.outputs.configured == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // working-directory applies to `run` steps, not to actions, so this
            // path is relative to the workspace root.
            const file = 'terraform/plan.txt';
            if (!fs.existsSync(file)) return;   // plan died before writing anything
            const plan = fs.readFileSync(file, 'utf8');
            // Keep well inside GitHub's 65,536-character comment limit.
            const limit = 60000;
            const body = plan.length > limit
              ? `${plan.slice(0, limit)}\n\n…truncated. See the full plan in the job log.`
              : plan;
            const marker = '<!-- terraform-plan -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker));
            const text = `${marker}\n### Terraform plan\n\n\`\`\`terraform\n${body}\n\`\`\``;
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body: text });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body: text });
            }
