# Workflow for running nightly handicap updates and thus potentially triggering
# a new build of the Astro site.
#
name: Update players' official handicaps

on:
  # A backstop, not the schedule this actually runs on.
  #
  # GitHub queues `schedule` events and delivers them when it has capacity, which
  # for this repository has meant hours: across the last 300 scheduled runs, the
  # 03:00 slot was a median of 2h22m late in April 2026 and 4h32m late in
  # September, and not one started on time. The real clock is Cloud Scheduler,
  # which calls the admin service every two hours from 03:00 to 07:00 UTC, and once at 12:00 UTC, and the admin service
  # dispatches this workflow — `workflow_dispatch` is delivered immediately.
  # See terraform/scheduler.tf and admin/src/lib/workflows.ts.
  #
  # This stays because late is better than never on the day the admin service is
  # the broken one. When both fire, the concurrency group below serialises them,
  # and a second run in one day is a supported outcome rather than a mess: every
  # reading is kept, and `latestPerDay` in @hector/schemas decides which one the
  # site shows. A run that reads the same value twice costs a row.
  schedule:
    - cron: "0 3,13 * * *"

  # Allows you to run this workflow manually from the Actions tab. This is also
  # what the "Run now" button in the admin UI and the Cloud Scheduler jobs use.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  id-token: write

# One data update at a time, across ALL of them — this group name is deliberately
# shared with update-leaderboards.yml, update-player-biographies.yml and
# update-player-club-memberships.yml rather than being this workflow's own.
#
# Every one of them ends in `git pull -r && git push` in commit-changes.sh, so
# any two that overlap race over the same push and the loser fails. They used to
# be kept apart by starting at different times, which stopped being true twice
# over: the Cloud Scheduler tick starts handicaps and leaderboards in the same
# second, and GitHub's own crons — still live as a backstop — are delivered hours
# late and therefore land anywhere at all.
#
# Serialising them costs nothing. These are scrapes of minutes, twice a day, and
# a run that waits for another to finish is a run that still happens.
#
# `cancel-in-progress: false` so a queued run waits rather than dropping. Note
# that GitHub keeps at most one run pending per group, so a third arriving while
# one runs and one waits does cancel the waiting one. That is visible as a
# `cancelled` row on the admin's Operations page rather than a silent skip, and
# the next tick picks the data up anyway.
concurrency:
  group: "data-update"
  cancel-in-progress: false

env:
  BUILD_PATH: ./astrosite

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces keep one lockfile, at the repository root, so the
      # install happens there rather than inside astrosite/.
      - name: Install dependencies
        run: npm ci
      - name: Run script
        run: |
          npx tsx src/workflows/update-handicaps.ts
        working-directory: ${{ env.BUILD_PATH }}
        env:
          WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
          WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
      - name: Commit changes
        id: commit
        run: |
          scripts/commit-changes.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GIT_AUTHOR_NAME: update-handicaps.yml
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: update-handicaps.yml
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}

      # A push made with GITHUB_TOKEN does not trigger workflows, so deploy-site.yml's
      # `on: push` has never fired for these commits and the site waited for that
      # workflow's own cron. This asks the admin service — which holds a token
      # that is not GITHUB_TOKEN — to dispatch it now instead.
      - name: Request a deploy
        uses: ./.github/actions/request-deploy
        with:
          committed: ${{ steps.commit.outputs.committed }}
          wif_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          admin_domain: ${{ vars.TF_ADMIN_DOMAIN }}
          iap_client_id: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
