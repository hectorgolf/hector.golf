name: PR Checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: astrosite

    env:
      # Wisegolf credentials
      WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
      WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
      # API key for app.hector.golf
      HECTOR_APP_API_KEY: ${{ secrets.HECTOR_APP_API_KEY }}
      # Public URL of the leaderboard proxy. Unset simply leaves the live
      # leaderboard off, and every page renders from the last published snapshot.
      PUBLIC_LEADERBOARD_PROXY_URL: ${{ vars.PUBLIC_LEADERBOARD_PROXY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: astrosite/.node-version
          cache: npm
          cache-dependency-path: astrosite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
