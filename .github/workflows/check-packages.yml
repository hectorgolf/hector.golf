# Runs the workspace packages' own test suites on pull requests.
#
# Separate from check-admin.yml and check-site.yml for the reason those two are
# separate from each other: different code with different failure modes, and one
# workflow each keeps any of them from going red for another's reasons.
#
# ## Why this exists at all
#
# Until 2026-09-21 no package under `packages/` had a test of its own. What they
# had instead were tests in whichever app happened to call them —
# `biography-input.test.ts` testing `@hector/schemas` from `admin/test/`,
# `course-tee-edits.test.ts` testing it from `astrosite/test/unit/` — which is
# how a function ends up tested twice, or not at all, depending on which app
# somebody was working in when they wrote it.
#
# A package's tests now live in the package. That only means anything if
# something runs them: both app workflows already trigger on `packages/**`, so a
# change here ran two app suites and none of the package's own.
#
# ## The paths filter
#
# `packages/**` and what an install reads. Deliberately *not* the apps: a change
# to `admin/` cannot break a package's tests, and a workflow that runs on
# everything is one people stop reading.
name: Check packages

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/check-packages.yml'

permissions:
  contents: read

jobs:
  check:
    name: Test packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Discovered rather than enumerated, and `--workspaces` is not it: that
      # flag covers every workspace in the root manifest, which includes both
      # apps — this would run their suites too and stop being separate from the
      # workflows that already do.
      #
      # So: every directory under packages/ that has a `test` script. A package
      # that gains one is run from that moment without anybody remembering this
      # file, which is the same objection check-admin.yml raises against naming
      # the packages individually in its own paths filter. `ui` and `wisegolf`
      # have no suite yet and are skipped rather than failed.
      - name: Test
        run: |
          ran=0
          for manifest in packages/*/package.json; do
            package="$(dirname "$manifest")"
            if node -e "process.exit(require('./$manifest').scripts?.test ? 0 : 1)"; then
              echo "::group::$package"
              npm run test --workspace "$package"
              echo "::endgroup::"
              ran=$((ran + 1))
            else
              echo "no test script in $package, skipping"
            fi
          done
          echo "ran $ran package suite(s)"
          # A run that tested nothing is a filter or a script name that has
          # drifted, and it would otherwise be a green tick over no work at all.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No package suites ran. Either packages/ lost its test scripts or this filter is wrong."
            exit 1
          fi
