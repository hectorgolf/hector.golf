# Rolls the Cloud Functions in backend/backend-functions out to GCP.
#
# ## Why this exists
#
# Every other deployable thing here redeploys itself when its code lands on
# main: deploy-admin.yml watches `admin/**`, deploy.yml watches `astrosite/**`,
# terraform-apply.yml watches `terraform/**`. `backend/**` matched none of them,
# so the four functions were deployed only by somebody running `npm run
# deploy:*` on a laptop. A dependency bump merged in #84 and went nowhere, which
# is how the gap was noticed: the manifest on main said one thing and the
# running functions said another, with nothing to reconcile them.
#
# ## It deploys configuration, not only code
#
# This is what phases 1 to 6 of docs/plans/functions-migration.md bought. The
# functions now run in hector-golf, the project terraform/ manages, and their
# three keys live in Secret Manager containers that iam.tf grants the runtime
# identity read on. So every deploy can state the whole of a function's
# configuration — `--service-account` and `--set-secrets` below — rather than
# inheriting whatever the last laptop happened to set.
#
# An earlier version of this workflow deliberately passed no environment
# variables at all, because the only way to set them was --set-env-vars from
# somebody's .env and shipping a dependency bump had no business knowing
# GOOGLE_GEMINI_API_KEY. That reasoning is spent: --set-secrets names a secret
# rather than a value, so nothing secret passes through this file, this runner
# or this repository. The values are added once with `gcloud secrets versions
# add` and never again.
#
# The consequence worth knowing is the good one. Rotating a key is now
# `gcloud secrets versions add` on its own — the functions reference `:latest`,
# so a new instance picks the new value up without a redeploy, and a redeploy
# only shortens the wait.
#
# ## Identity
#
# GH_WIF_PROVIDER is the same pool every other workflow here federates through,
# which is the whole point of the migration: one project, one pool. There is no
# GH_FUNCTIONS_WIF_PROVIDER and there should not be.
#
# functions-deployer holds roles/cloudfunctions.developer and
# roles/iam.serviceAccountUser on hector-functions, and nothing else. If a
# deploy fails naming a permission, add that role in terraform/iam.tf rather
# than widening the account here — and see the note there about why
# roles/storage.objectAdmin in particular is the wrong answer.

name: Deploy Cloud Functions

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/backend-functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Unlike deploy-admin.yml, in-progress runs are not cancelled. That workflow
# rolls out one Cloud Run revision, which is atomic — losing a half-finished one
# costs nothing. This one walks four independent functions, so a cancellation
# lands somewhere in the middle and leaves two of them on the new code and two
# on the old, with nothing recording which. Queueing is the cheaper failure.
concurrency:
  group: "deploy-functions"
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ matrix.function }}
    runs-on: ubuntu-latest

    # One job per function, and fail-fast off, for the reason backend-checks.yml
    # is separate from admin-checks.yml: these fail for unrelated reasons, and a
    # broken leaderboard proxy should not stop the biography generator shipping.
    # The flags mirror the `npm run deploy:*` scripts in package.json exactly —
    # if one changes there, change it here.
    # `secrets` is the --set-secrets argument: ENV_VAR=<secret id>:latest, and
    # the ids are the keys of local.function_secrets in terraform/secrets.tf.
    # Naming a secret is not naming a value, so nothing sensitive is in here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - function: ExtractScorecardInformation
            secrets: "GOOGLE_GEMINI_API_KEY=gemini-api-key:latest,ASTROSITE_API_KEY=astrosite-api-key:latest"
            extra_flags: ""
          - function: GeneratePlayerBiography
            secrets: "GOOGLE_GEMINI_API_KEY=gemini-api-key:latest,ASTROSITE_API_KEY=astrosite-api-key:latest"
            extra_flags: "--timeout=540s"
          - function: GeneratePlayerAvatar
            secrets: "GOOGLE_GEMINI_API_KEY=gemini-api-key:latest,ASTROSITE_API_KEY=astrosite-api-key:latest"
            extra_flags: "--timeout=540s"
          - function: TournamentLeaderboard
            secrets: "HECTOR_APP_API_KEY=hector-app-api-key:latest"
            extra_flags: "--timeout=30s --max-instances=5"

    defaults:
      run:
        working-directory: backend/backend-functions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_FUNCTIONS_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # --source=. uploads this directory and Cloud Build runs the buildpack
      # against it, which installs from package-lock.json and then runs the
      # `gcp-build` script to compile TypeScript. Nothing is built here: a
      # dist/ built on the runner would be uploaded and then rebuilt anyway.
      # .gcloudignore keeps node_modules, test/ and samples/ out of the upload,
      # which is also why the install in the build is a clean one and picks up
      # the `overrides` block in package.json.
      - name: Deploy
        run: |
          gcloud functions deploy ${{ matrix.function }} \
            --gen2 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --runtime=nodejs24 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point=${{ matrix.function }} \
            --source=. \
            --service-account="${{ vars.GH_FUNCTIONS_RUNTIME_SA }}" \
            --set-secrets="${{ matrix.secrets }}" \
            ${{ matrix.extra_flags }} \
            --quiet

      - name: Summarise
        if: success()
        run: |
          {
            echo "### Deployed ${{ matrix.function }}"
            echo
            echo "- Commit: \`${GITHUB_SHA::12}\`"
            echo "- Region: ${{ vars.GCP_REGION }}"
            echo "- Runs as: ${{ vars.GH_FUNCTIONS_RUNTIME_SA }}"
            echo "- Secrets: \`${{ matrix.secrets }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
