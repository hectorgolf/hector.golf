# Workflow for updating the live leaderboards for ongoing tournaments and thus
# potentially triggering a new build of the Astro site.
#
name: Update tournament leaderboards

on:
  # Runs at 03:15 and 13:15 UTC every day
  schedule:
    - cron: "15 3,12 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  id-token: write

env:
  BUILD_PATH: ./astrosite

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces keep one lockfile, at the repository root, so the
      # install happens there rather than inside astrosite/.
      - name: Install dependencies
        run: npm ci
      - name: Run script
        run: |
          npx tsx src/workflows/update-leaderboards.ts
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_CREDENTIALS }}
          HECTOR_APP_API_KEY: ${{ secrets.HECTOR_APP_API_KEY }}
      - name: Commit changes
        run: |
          scripts/commit-changes.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GIT_AUTHOR_NAME: update-leaderboards.yml
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: update-leaderboards.yml
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
