# Workflow for updating the live leaderboards for ongoing tournaments and thus
# potentially triggering a new build of the Astro site.
#
name: Update tournament leaderboards

on:
  # A backstop, not the schedule this actually runs on: GitHub delivers
  # `schedule` events hours late for this repository. Cloud Scheduler calls the
  # admin service at 03:00 and 12:00 UTC and it dispatches this workflow along
  # with update-handicaps.yml, which arrives immediately. See
  # terraform/scheduler.tf and update-handicaps.yml for the measurements.
  #
  # The quarter-past offset below no longer separates this from the handicap
  # scrape — the tick starts both at once — so the two are kept apart by the
  # shared concurrency group instead, which is a real interlock rather than a
  # guess about how long the other one takes.
  #
  # (The cron has read `15 3,12` throughout; this comment used to say 13:15.)
  schedule:
    - cron: "15 3,12 * * *"

  # Allows you to run this workflow manually from the Actions tab. This is also
  # what the "Run now" button in the admin UI and the Cloud Scheduler jobs use.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  id-token: write

# Shared with the other three data updates on purpose: they all end in the same
# `git pull -r && git push`, and the scheduled tick now starts this one and the
# handicap scrape in the same second. See update-handicaps.yml for the full note.
concurrency:
  group: "data-update"
  cancel-in-progress: false

env:
  BUILD_PATH: ./astrosite

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces keep one lockfile, at the repository root, so the
      # install happens there rather than inside astrosite/.
      - name: Install dependencies
        run: npm ci
      # The same keyless exchange every other workflow here uses, replacing the
      # downloadable service account key this one used to read from the
      # GCP_SERVICE_ACCOUNT_CREDENTIALS secret. This writes an Application
      # Default Credentials file and points GOOGLE_APPLICATION_CREDENTIALS at
      # it; google-sheets.ts picks that up by omitting `credentials` when
      # GOOGLE_CREDENTIALS is unset. `id-token: write` is declared above.
      #
      # leaderboard-reader holds no project roles at all. Its access to the two
      # spreadsheets comes from their being shared with its email address, so a
      # sheet that has not been shared fails with a 403 rather than with an
      # authentication error. See docs/plans/sheets-credential-wif.md.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: ${{ vars.GH_LEADERBOARD_SA }}
      - name: Run script
        run: |
          npx tsx src/workflows/update-leaderboards.ts
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HECTOR_APP_API_KEY: ${{ secrets.HECTOR_APP_API_KEY }}
      - name: Commit changes
        run: |
          scripts/commit-changes.sh
        working-directory: ${{ env.BUILD_PATH }}
        env:
          GIT_AUTHOR_NAME: update-leaderboards.yml
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: update-leaderboards.yml
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
