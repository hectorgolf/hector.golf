name: Deploy hector.golf

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]      # Only run when the push is to the "main" branch
    # The build below is `npm ci` at the repository root and then `astro build`
    # in astrosite/, so the site is not the only input to it: astrosite imports
    # @hector/ui and @hector/schemas through the workspace, installs from the one
    # root lockfile, and takes its Node version from .node-version. Those used to
    # be missing here, and a merge that only touched packages/ shipped nothing —
    # the cron below eventually republished it, hours later, which is why the gap
    # stayed invisible. This mirrors check-site.yml's filter, which runs the same
    # build on the pull request.
    paths:
      - 'astrosite/**'            # Only run when the push includes changes to the Astro website
      - 'packages/schemas/**'     # ...or to the workspace packages astrosite imports
      - 'packages/ui/**'
      - 'package.json'            # ...or to what `npm ci` installs at the root
      - 'package-lock.json'
      - '.node-version'           # ...or to the Node version it installs under
      - '.github/workflows/**/*'  # ...or on Github Actions workflows

  # The usual path is not a clock at all: a data update that commits asks the
  # admin service to dispatch this workflow, so a scrape publishes within a
  # minute of finishing. The `on: push` trigger above never fires for a scrape,
  # because a push made with GITHUB_TOKEN does not trigger workflows.
  #
  # The backstop for a failed deploy request used to be a `0 8,13` cron here. It
  # is now an entry in `DISPATCHABLE_WORKFLOWS` with a one-day interval, so the
  # tick dispatches this only when no deploy has happened in 24 hours — which is
  # to say only when the normal path is already broken. Same backstop, expressed
  # in the mechanism that replaced the crons rather than in the one it replaced.
  # No `schedule:` here, deliberately. Cloud Scheduler is the only clock.
  #
  # GitHub queues `schedule` events and delivers them when it has capacity, which
  # for this repository has meant hours: on 2026-09-16 the last scheduled
  # delivery of each workflow here was between two and five hours late, and one
  # of them landed on the wrong calendar day. A cron kept "as a backstop" is
  # therefore a second clock that is always wrong, and its runs are duplicates
  # somebody has to explain every time they read the Actions tab.
  #
  # What starts this now is `terraform/scheduler.tf` -> the admin service ->
  # `workflow_dispatch`, which GitHub delivers immediately. Which workflows the
  # tick starts, and how often, is `DISPATCHABLE_WORKFLOWS` in
  # `admin/src/lib/workflows.ts`; `admin/src/lib/cadence.ts` explains the
  # intervals and why they are intervals rather than crons.
  #
  # The cost, chosen knowingly: if Cloud Scheduler or the admin service is down,
  # this does not run, and nothing goes red to say so. Before, it would merely
  # have been late.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # Build the Astro site and prepare it for deployment to GitHub Pages.
  # This job will run the build command and upload the built site as an artifact
  # that can be used in the deployment step.
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Checkout the repository so we can access the Astro project files and
      # build the site.
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # Set up Github Pages, which will give us the correct base path and
      # origin to use when building the site with `withastro/action`.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # withastro/action runs its own `npm ci` inside `path`, which an npm
      # workspace cannot satisfy: there is one lockfile and it lives at the
      # repository root. The steps it wrapped are written out here instead, which
      # also makes the build visible rather than delegated.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Whether this deploy can read the scraped data from the admin service.
      #
      # Unconfigured is not a failure, and that is the same call
      # `.github/actions/request-deploy` makes for the same reason: a project that
      # has not been wired up yet should not have red deploys. The build handles
      # it — with no credentials it reads `data/handicaps/observations.ndjson` and
      # says so in the log, which is the supported way a fork builds this site.
      #
      # What *is* a failure is being configured and unable to reach the service,
      # and that failure belongs to the build rather than to this step. See
      # `astrosite/src/code/admin-api.ts` for why there is no third
      # branch where it quietly publishes the backup instead.
      - name: Decide whether the build can read from the admin service
        id: admin_api
        run: |
          missing=""
          [ -n "${{ vars.GH_WIF_PROVIDER }}" ]           || missing="$missing GH_WIF_PROVIDER"
          [ -n "${{ vars.GCP_PROJECT_ID }}" ]            || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ vars.TF_ADMIN_DOMAIN }}" ]           || missing="$missing TF_ADMIN_DOMAIN"
          [ -n "${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}" ] || missing="$missing TF_IAP_OAUTH_CLIENT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Building from the committed backups — unconfigured:$missing."
            echo "live=false" >> "$GITHUB_OUTPUT"
          else
            echo "live=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google
        id: auth
        if: steps.admin_api.outputs.live == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          # The scheduler's identity, which already holds IAP access. This build
          # reads; it is not given anything that can write.
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          # An ID token for IAP rather than an access token: IAP authenticates the
          # caller from this, and the audience has to be the OAuth client in front
          # of the service or it is rejected.
          token_format: id_token
          id_token_audience: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
          id_token_include_email: true

      # Absorb the race between this workflow and `deploy-admin`.
      #
      # A merge that adds an endpoint *and* the reader for it starts both deploys
      # at once, and neither waits for the other — so this build can reach an
      # admin still serving the previous image. That is a 404, and the build then
      # fails rather than publishing the backup as current, which is right and
      # also seven hours of a stale site. `deploy-admin` takes about a minute, so
      # waiting turns the failure into a delay.
      #
      # It does not replace shipping the endpoint and the reader in separate
      # merges, which is free and still the right way round. See *Decisions* in
      # `docs/plans/handicaps-to-firestore.md`.
      #
      # The routes come from `ROUTES` in `astrosite/src/code/admin-api.ts`, the
      # same constant the readers use, so adding a dataset does not mean
      # remembering to edit this file too.
      - name: Wait for the admin to serve what this build reads
        if: steps.admin_api.outputs.live == 'true'
        working-directory: astrosite
        run: npx --no-install tsx scripts/wait-for-admin.ts
        env:
          ADMIN_API_URL: ${{ format('https://{0}', vars.TF_ADMIN_DOMAIN) }}
          ADMIN_API_TOKEN: ${{ steps.auth.outputs.id_token }}

      - name: Build the site
        working-directory: astrosite
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        env:
          # No WiseGolf credentials: the build does not talk to WiseGolf. `handicaps.ts`
          # exports `getPlayerHandicap`, but no page calls it — handicaps are read from
          # the admin service or the committed backup — so `createWisegolfSession` is
          # never constructed here. The scrape lives in the three update workflows.
          #
          # Public URL of the leaderboard proxy. Unset simply leaves the live
          # leaderboard off, and every page renders from the last published snapshot.
          PUBLIC_LEADERBOARD_PROXY_URL: ${{ vars.PUBLIC_LEADERBOARD_PROXY_URL }}
          # A base URL rather than one per dataset: the site reads two logs through
          # this already and two more scrapes are planned, so a variable pair per
          # collection would mean editing this step every time the admin learns to
          # serve something. The path belongs to the caller, which knows which log
          # it wants.
          #
          # Both or neither. `admin-api.ts` refuses a half-configured
          # build rather than falling back, because setting one of these is a
          # statement that this deploy was wired to the API and answering a typo
          # with the backup is a silent stale publish. The `if` on the auth step
          # above is what keeps them in step: unconfigured leaves both empty.
          ADMIN_API_URL: ${{ steps.admin_api.outputs.live == 'true' && format('https://{0}', vars.TF_ADMIN_DOMAIN) || '' }}
          ADMIN_API_TOKEN: ${{ steps.auth.outputs.id_token }}

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: astrosite/dist

  # This is the deployment step that takes the built site artifact from the
  # previous step and deploys it to GitHub Pages. This step will only run after
  # the build step has completed successfully.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
