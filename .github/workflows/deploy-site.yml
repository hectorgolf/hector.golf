name: Deploy hector.golf

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]      # Only run when the push is to the "main" branch
    # The build below is `npm ci` at the repository root and then `astro build`
    # in astrosite/, so the site is not the only input to it: astrosite imports
    # @hector/ui and @hector/schemas through the workspace, installs from the one
    # root lockfile, and takes its Node version from .node-version. Those used to
    # be missing here, and a merge that only touched packages/ shipped nothing —
    # the cron below eventually republished it, hours later, which is why the gap
    # stayed invisible. This mirrors check-site.yml's filter, which runs the same
    # build on the pull request.
    paths:
      - 'astrosite/**'            # Only run when the push includes changes to the Astro website
      - 'packages/schemas/**'     # ...or to the workspace packages astrosite imports
      - 'packages/ui/**'
      - 'package.json'            # ...or to what `npm ci` installs at the root
      - 'package-lock.json'
      - '.node-version'           # ...or to the Node version it installs under
      - '.github/workflows/**/*'  # ...or on Github Actions workflows

  # The backstop, not the usual path.
  #
  # A data update that commits now asks the admin service to dispatch this
  # workflow, so a scrape publishes within a minute of finishing rather than
  # waiting for a clock. This cron covers the day that request fails — and the
  # `on: push` trigger above, which never fires for a scrape, because a push made
  # with GITHUB_TOKEN does not trigger workflows.
  #
  # 08:00 and 13:00 sit after the data ticks rather than among them: those are
  # every two hours from 03:00 to 07:00, and once at 12:00, in
  # terraform/scheduler.tf. This used to be `30 3,12`, which was after the ticks
  # when there were two of them and would now fire in the middle of the morning
  # window, backstopping data that had not arrived yet.
  schedule:
    - cron: "0 8,13 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # Build the Astro site and prepare it for deployment to GitHub Pages.
  # This job will run the build command and upload the built site as an artifact
  # that can be used in the deployment step.
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Checkout the repository so we can access the Astro project files and
      # build the site.
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # Set up Github Pages, which will give us the correct base path and
      # origin to use when building the site with `withastro/action`.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # withastro/action runs its own `npm ci` inside `path`, which an npm
      # workspace cannot satisfy: there is one lockfile and it lives at the
      # repository root. The steps it wrapped are written out here instead, which
      # also makes the build visible rather than delegated.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The site no longer builds from files in this repository — the data lives
      # in Firestore and the admin service serves it. See
      # docs/plans/everything-to-firestore.md.
      #
      # An ID token for IAP, not an access token: the build calls the admin
      # service through the same front door as everything else, and the audience
      # has to be the OAuth client in front of it or the call is rejected. Same
      # mechanism as .github/actions/request-deploy.
      #
      # If these are missing, the build falls back to the committed snapshot and
      # says so very loudly in its log. That is correct for a fork and wrong for
      # this workflow, which is why the guard below fails rather than warns.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GH_WIF_PROVIDER }}
          service_account: hector-scheduler@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ secrets.TF_IAP_OAUTH_CLIENT_ID }}
          id_token_include_email: true

      # A deploy that silently published the fallback would be indistinguishable
      # from a working one until somebody noticed the handicaps had stopped
      # moving. The build itself refuses to fall back when it *has* credentials;
      # this refuses to run without them in the first place.
      - name: Refuse to deploy without live data
        run: |
          if [ -z "${{ steps.auth.outputs.id_token }}" ] || [ -z "${{ vars.TF_ADMIN_DOMAIN }}" ]; then
            echo "::error::No credentials for the admin service, so this build would publish the committed"
            echo "::error::fallback snapshot instead of live data. Check GH_WIF_PROVIDER, TF_ADMIN_DOMAIN"
            echo "::error::and TF_IAP_OAUTH_CLIENT_ID. See docs/plans/everything-to-firestore.md."
            exit 1
          fi

      - name: Build the site
        working-directory: astrosite
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        env:
          WISEGOLF_USERNAME: ${{ secrets.WISEGOLF_USERNAME }}
          WISEGOLF_PASSWORD: ${{ secrets.WISEGOLF_PASSWORD }}
          # Public URL of the leaderboard proxy. Unset simply leaves the live
          # leaderboard off, and every page renders from the last published snapshot.
          PUBLIC_LEADERBOARD_PROXY_URL: ${{ vars.PUBLIC_LEADERBOARD_PROXY_URL }}
          # Where the data comes from. `src/code/data-source.ts` reads both.
          HECTOR_ADMIN_ORIGIN: https://${{ vars.TF_ADMIN_DOMAIN }}
          HECTOR_ADMIN_ID_TOKEN: ${{ steps.auth.outputs.id_token }}

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: astrosite/dist

  # This is the deployment step that takes the built site artifact from the
  # previous step and deploys it to GitHub Pages. This step will only run after
  # the build step has completed successfully.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
