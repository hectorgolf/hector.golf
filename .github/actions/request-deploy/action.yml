name: Request a deploy
description: >
  Ask the admin service to dispatch deploy.yml, after a data update has committed
  something. Does nothing when there was nothing to commit.

# Why this goes through the admin rather than calling GitHub directly.
#
# A push made with the default GITHUB_TOKEN does not trigger workflows — that is
# GitHub's recursion guard — so deploy.yml's `on: push` never fired for the data
# commits that most needed it, and the site waited for its own `30 3,12` cron.
# Dispatching deploy.yml from here with GITHUB_TOKEN would not work either: the
# same rule covers API-triggered events.
#
# What does work is a token that is not GITHUB_TOKEN. The admin service already
# holds one, in Secret Manager, because dispatching workflows is its job — so the
# choice is between copying that token into a GitHub secret for four workflows to
# use, or asking the service that already has it. This asks.
#
# It gets in the same front door as everything else: an ID token minted for the
# IAP audience, the same way the Cloud Scheduler jobs authenticate. There is no
# bypass, and the endpoint still reads the caller's identity from the IAP header.

inputs:
  committed:
    description: 'Whether the data update committed anything. Nothing happens unless this is exactly "true".'
    required: true
  wif_provider:
    description: 'Workload Identity provider, from vars.GH_WIF_PROVIDER.'
    required: true
  service_account:
    description: 'The identity to impersonate. The scheduler account, which already has IAP access.'
    required: true
  admin_domain:
    description: 'Host of the admin service, from vars.TF_ADMIN_DOMAIN.'
    required: true
  iap_client_id:
    description: 'IAP OAuth client id — the audience the ID token has to carry.'
    required: true

runs:
  using: composite
  steps:
    - name: Decide whether to ask
      id: guard
      shell: bash
      run: |
        if [ "${{ inputs.committed }}" != "true" ]; then
          echo "::notice::Nothing was committed, so there is nothing new to publish."
          echo "ask=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        missing=""
        [ -n "${{ inputs.wif_provider }}" ]    || missing="$missing GH_WIF_PROVIDER"
        [ -n "${{ inputs.service_account }}" ] || missing="$missing scheduler service account"
        [ -n "${{ inputs.admin_domain }}" ]    || missing="$missing TF_ADMIN_DOMAIN"
        [ -n "${{ inputs.iap_client_id }}" ]   || missing="$missing TF_IAP_OAUTH_CLIENT_ID"
        if [ -n "$missing" ]; then
          # Not a failure. The data is committed either way, and deploy.yml's own
          # cron still publishes it; this path is an improvement on that, not a
          # replacement for it. A project that has not been wired up yet should
          # not have red data updates.
          echo "::notice::Not asking for a deploy — unconfigured:$missing. deploy.yml's cron will publish this."
          echo "ask=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "ask=true" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google
      id: auth
      if: steps.guard.outputs.ask == 'true'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.service_account }}
        # An ID token for IAP, not an access token: IAP authenticates the caller
        # from this, and the audience has to be the OAuth client in front of the
        # service or it is rejected. The email is what the endpoint logs.
        token_format: id_token
        id_token_audience: ${{ inputs.iap_client_id }}
        id_token_include_email: true

    - name: Ask the admin to deploy
      if: steps.guard.outputs.ask == 'true'
      shell: bash
      env:
        ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        ADMIN_DOMAIN: ${{ inputs.admin_domain }}
      run: |
        # Content-Type matters, and not for the reason it looks like. Astro's CSRF
        # check forbids a cross-origin POST that arrives *without* a content type at
        # all, not only one carrying a form content type — see `origin-check.js`:
        #
        #     if (hasContentType) { return formLikeHeader && !isSameOrigin }
        #     return !isSameOrigin
        #
        # curl sends no content type when there is no body, so this asked with none
        # and got back 403 "Cross-site POST form submissions are forbidden" from the
        # moment it was written. Cloud Scheduler has always sent JSON and an empty
        # body for exactly this reason — see the http_target in
        # terraform/scheduler.tf — and this is the same request, spelled the same way.
        #
        # No Accept: text/html, so the endpoint answers JSON rather than a 303.
        status=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
          -X POST "https://${ADMIN_DOMAIN}/api/workflows/deploy/dispatch" \
          -H "Authorization: Bearer ${ID_TOKEN}" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          --data '{}' \
          --max-time 30) || status=000
        echo "HTTP $status"
        cat /tmp/dispatch-response.json 2>/dev/null || true
        echo
        # 202 is the success the endpoint actually returns: GitHub has accepted the
        # dispatch and does not say which run it created, so the endpoint reports only
        # that it asked. 200 and 204 are here because a caller should not break if it
        # ever answers a plainer yes.
        if [ "$status" = "202" ] || [ "$status" = "200" ] || [ "$status" = "204" ]; then
          echo "::notice::Asked the admin service to deploy."
          exit 0
        fi
        # Deliberately a warning rather than a failure. The data is committed and
        # pushed; deploy.yml's cron will publish it within hours. Failing here
        # would turn "the site is a bit stale" into "the scrape is broken", and
        # the scrape was not.
        echo "::warning::The admin service did not accept the deploy request (HTTP $status). deploy.yml's cron will publish this instead."
